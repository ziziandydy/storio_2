<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storio — Elegant</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400&display=block" rel="stylesheet">
<style>
  :root { --ink: #070707; --gold: #c5a059; --gold-soft: #d9bf86; --ivory: #ece5d6; --dim: rgba(236,229,214,.58); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
  body { font-family: Jost, sans-serif; color: var(--ivory); -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  .c { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); }
  #root { position: absolute; inset: 0; overflow: hidden; background: var(--ink); }
  #bg { position: absolute; inset: -10%;
        background: radial-gradient(55% 34% at 50% 42%, rgba(197,160,89,.13), rgba(197,160,89,0) 72%),
                    radial-gradient(80% 50% at 50% 115%, rgba(90,60,25,.18), rgba(0,0,0,0) 70%), var(--ink); }
  #stage { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; visibility: hidden; }
  #fxCanvas, #vignette, #grain { position: absolute; inset: 0; pointer-events: none; }
  #vignette { background: radial-gradient(120% 80% at 50% 46%, rgba(0,0,0,0) 58%, rgba(0,0,0,.72) 100%); }
  #grain { opacity: .05; mix-blend-mode: overlay; background-size: 256px 256px; }

  .serif { font-family: 'Cormorant Garamond', serif; font-weight: 400; white-space: nowrap; }
  .it { font-style: italic; color: var(--gold-soft); }
  .kicker { font-family: Jost; font-weight: 300; font-size: 26px; letter-spacing: .5em; text-transform: uppercase; color: var(--gold); white-space: nowrap; padding-left: .5em; }
  .rule { position: absolute; height: 1px; background: linear-gradient(90deg, rgba(197,160,89,0), rgba(197,160,89,.85), rgba(197,160,89,0)); }
  .word { display: inline-block; }

  .logo { position: absolute; }
  .logo .part { position: absolute; inset: 0; }
  .logo .part img { width: 100%; height: 100%; display: block; }

  .row { position: absolute; left: 0; display: flex; gap: 36px; }
  .card { width: 280px; height: 420px; border-radius: 14px; background-size: cover; background-position: center; flex: none;
          box-shadow: 0 30px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(197,160,89,.22); }

  #hero { position: absolute; width: 440px; height: 660px; border-radius: 18px; background-size: cover; background-position: center;
          box-shadow: 0 50px 100px rgba(0,0,0,.75), 0 0 0 1px rgba(197,160,89,.35); }
  .star { position: absolute; width: 50px; height: 50px; }
  .star svg { width: 100%; height: 100%; overflow: visible; }

  .tpl { position: absolute; width: 540px; height: 960px; border-radius: 22px; background-size: cover; background-position: center;
         box-shadow: 0 60px 120px rgba(0,0,0,.8), 0 0 0 1px rgba(197,160,89,.3); }
  #cta { font-family: Jost; font-weight: 400; font-size: 28px; letter-spacing: .38em; padding: 22px 40px 22px 52px; color: var(--gold);
         border: 1px solid rgba(197,160,89,.6); border-radius: 999px; white-space: nowrap; }
</style>
</head>
<body>
<div id="root">
  <div id="bg"></div>
  <div id="stage">
    <section class="scene" id="s1">
      <div class="rule c" id="line1" style="left:540px;top:820px;width:760px"></div>
      <div class="logo c" id="logoA" style="left:540px;top:800px;width:620px;height:620px"></div>
      <div class="c serif" id="tagA" style="left:540px;top:1260px;font-size:84px;line-height:1.08;text-align:center">Collect stories<br><span class="it">in your folio.</span></div>
    </section>

    <section class="scene" id="s2">
      <div class="c kicker" id="k2" style="left:540px;top:350px">Your Folio</div>
      <div class="c serif" id="wFilms" style="left:540px;top:450px;font-size:112px">Every <span class="it">film.</span></div>
      <div class="c serif" id="wSeries" style="left:540px;top:450px;font-size:112px">Every <span class="it">season.</span></div>
      <div class="c serif" id="wBooks" style="left:540px;top:450px;font-size:112px">Every <span class="it">book.</span></div>
      <div class="row" id="row1" style="top:610px"></div>
      <div class="row" id="row2" style="top:1080px"></div>
    </section>

    <section class="scene" id="s3">
      <div class="c kicker" id="k3" style="left:540px;top:350px">Rate &amp; Reflect</div>
      <div class="c" id="hero" style="left:540px;top:760px;background-image:url(../../art/out/pale_harbor.jpg)"></div>
      <div class="c" id="stars" style="left:540px;top:1170px;width:710px;height:50px"></div>
      <div class="c serif" id="refl" style="left:540px;top:1330px;font-size:54px;line-height:1.25;text-align:center;color:var(--ivory)"><span class="it">“Watched it twice.</span><br><span class="it">The quiet ending stayed with me.”</span></div>
    </section>

    <section class="scene" id="s4">
      <div class="c kicker" id="k4" style="left:540px;top:350px">Share</div>
      <div class="c serif" id="shareHead" style="left:540px;top:440px;font-size:84px">Made to be <span class="it">shared.</span></div>
      <div class="tpl c" id="tplA" style="left:540px;top:1040px;background-image:url(../../assets/share2/cine_ticket.png)"></div>
      <div class="tpl c" id="tplB" style="left:540px;top:1040px;background-image:url(../../assets/share2/read_desk.png)"></div>
    </section>

    <section class="scene" id="s5">
      <div class="logo c" id="logoB" style="left:540px;top:740px;width:560px;height:560px"></div>
      <div class="c serif" id="word" style="left:540px;top:1130px;font-size:150px;font-weight:500;letter-spacing:.02em">Storio</div>
      <div class="c serif" id="tagB" style="left:540px;top:1245px;font-size:54px"><span class="it">Collect stories in your folio.</span></div>
      <div class="rule c" id="line2" style="left:540px;top:1320px;width:420px"></div>
      <div class="c" id="cta" style="left:540px;top:1420px">FREE ON THE APP STORE</div>
    </section>
  </div>
  <canvas id="fxCanvas" width="1080" height="1920"></canvas>
  <div id="vignette"></div>
  <div id="grain"></div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script src="../../lib/kit.js"></script>
<script src="composition.js"></script>
</body>
</html>
