<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storio — Grind</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800;125,900&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
<style>
  :root { --black: #0a0a0a; --lime: #d4ff3a; --gold: #c5a059; --white: #fbfbf7; --pink: #ff4fa3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--black); }
  body { font-family: 'Space Grotesk', sans-serif; color: var(--white); -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; } .c { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); }
  #root { position: absolute; inset: 0; overflow: hidden; background: var(--black); }
  #bg { position: absolute; inset: -10%; background-image: radial-gradient(rgba(212,255,58,.14) 2px, transparent 2.5px); background-size: 34px 34px; }
  #bgWord { position: absolute; left: 50%; top: 50%; font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 125%; font-size: 620px; line-height: .8;
            color: transparent; -webkit-text-stroke: 3px rgba(212,255,58,.08); white-space: nowrap; }
  #stage { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; visibility: hidden; }
  .x { font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 125%; text-transform: uppercase; line-height: .86; letter-spacing: -.02em; white-space: nowrap; }
  .char { display: inline-block; will-change: transform; }
  .lime { color: var(--lime); }
  .hl { background: var(--lime); color: var(--black); padding: 0 18px; }
  .sticker { position: absolute; background: var(--white); color: var(--black); border-radius: 22px; box-shadow: 0 0 0 7px var(--black), 0 0 0 14px var(--white), 14px 16px 0 14px rgba(0,0,0,.5);
             font: 700 34px 'Space Grotesk'; letter-spacing: .04em; padding: 16px 28px; white-space: nowrap; text-transform: uppercase; }
  .sticker.lime { background: var(--lime); }
  .sticker.pink { background: var(--pink); color: #fff; }
  .card { position: absolute; width: 900px; height: 190px; border-radius: 34px; background: #151515; border: 3px solid rgba(251,251,247,.1);
          display: flex; align-items: center; gap: 34px; padding: 0 44px; }
  .card .n { font-family: Archivo; font-weight: 900; font-stretch: 125%; font-size: 120px; line-height: 1; color: var(--lime); min-width: 260px; }
  .card .l { font: 700 38px 'Space Grotesk'; letter-spacing: .08em; text-transform: uppercase; }
  .card svg { width: 64px; height: 64px; margin-left: auto; color: var(--gold); }
  #chart { position: absolute; width: 900px; height: 300px; border-radius: 34px; background: #151515; border: 3px solid rgba(251,251,247,.1); }
  .bar { position: absolute; bottom: 60px; width: 18px; border-radius: 9px; background: var(--gold); transform-origin: 50% 100%; }
  .bar.hot { background: var(--lime); }
  .tile { position: absolute; width: 250px; height: 375px; border-radius: 20px; background-size: cover; background-position: center;
          box-shadow: 0 0 0 6px var(--white), 10px 12px 0 6px rgba(0,0,0,.55); }
  .tpl { position: absolute; width: 500px; height: 889px; border-radius: 28px; background-size: cover; background-position: center; box-shadow: 0 0 0 8px var(--white), 18px 20px 0 8px rgba(0,0,0,.6); }
  .btn { position: absolute; height: 110px; padding: 0 60px; border-radius: 30px; background: var(--gold); color: var(--black); display: flex; align-items: center; gap: 22px;
         font: 700 44px 'Space Grotesk'; letter-spacing: .14em; white-space: nowrap; }
  .btn svg { width: 46px; height: 46px; }
  .part { position: absolute; inset: 0; } .part img { width: 100%; height: 100%; display: block; }
  .logo { position: absolute; border-radius: 50%; }
  #logoDisc { position: absolute; inset: 0; border-radius: 50%; background: #070707; box-shadow: 0 0 0 10px var(--white), 18px 20px 0 10px rgba(0,0,0,.6); }
  #fxCanvas, #flash, #grain { position: absolute; inset: 0; pointer-events: none; }
  #flash { background: var(--lime); opacity: 0; mix-blend-mode: overlay; }
  #grain { opacity: .06; mix-blend-mode: overlay; background-size: 256px 256px; }
</style>
</head>
<body>
<div id="root">
  <div id="bg"></div>
  <div id="bgWord">2026</div>
  <div id="stage">
    <section class="scene" id="s1">
      <div class="c x lime" id="count" style="left:540px;top:760px;font-size:520px">0</div>
      <div class="c sticker" id="countLbl" style="left:540px;top:1100px;transform:rotate(-3deg)">stories this year</div>
      <div class="c sticker lime" id="counting" style="left:800px;top:470px">and counting</div>
      <div class="c x" id="w1" style="left:540px;top:640px;font-size:190px">YOU</div>
      <div class="c x" id="w2" style="left:540px;top:830px;font-size:150px">FINISHED</div>
      <div class="c x" id="w3" style="left:540px;top:1010px;font-size:190px">THEM.</div>
      <div class="c x" id="flex" style="left:540px;top:1260px;font-size:136px"><span class="hl">NOW FLEX IT.</span></div>
      <div class="logo c" id="logoS" style="left:540px;top:900px;width:520px;height:520px"><div id="logoDisc"></div></div>
    </section>

    <section class="scene" id="s2">
      <div class="c x" id="head2" style="left:540px;top:380px;font-size:92px">YOUR <span class="lime">NUMBERS.</span></div>
      <div class="card c" id="cA" style="left:540px;top:600px"><div class="n" id="nA">0</div><div class="l">this year</div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></svg></div>
      <div class="card c" id="cB" style="left:540px;top:815px"><div class="n" id="nB">0</div><div class="l">books read</div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div>
      <div class="card c" id="cC" style="left:540px;top:1030px"><div class="n" id="nC">0</div><div class="l">series done</div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg></div>
      <div class="c" id="chart" style="left:540px;top:1340px"><div class="abs" style="left:44px;top:30px;font:700 26px 'Space Grotesk';letter-spacing:.2em;color:rgba(251,251,247,.6)">30-DAY TREND</div></div>
    </section>

    <section class="scene" id="s3">
      <div class="c x" id="e1" style="left:540px;top:360px;font-size:150px">EVERY.</div>
      <div class="c x lime" id="e2" style="left:540px;top:360px;font-size:150px">SINGLE.</div>
      <div class="c x" id="e3" style="left:540px;top:360px;font-size:150px"><span class="hl">ONE.</span></div>
      <div id="collage" class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>
    </section>

    <section class="scene" id="s4">
      <div class="c x" id="head4" style="left:540px;top:380px;font-size:84px">MONTHLY <span class="lime">RECAP.</span></div>
      <div class="tpl" id="rCol" style="background-image:url(../../assets/share2/grind_recap_collage.png)"></div>
      <div class="tpl" id="rCal" style="background-image:url(../../assets/share2/grind_recap_calendar.png)"></div>
      <div class="tpl" id="rWf" style="background-image:url(../../assets/share2/grind_recap_waterfall.png)"></div>
      <div class="c sticker pink" id="postIt" style="left:820px;top:560px">post it.</div>
      <div class="c btn" id="shareBtn" style="left:540px;top:1470px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>SHARE</div>
    </section>

    <section class="scene" id="s5">
      <div class="logo c" id="logo" style="left:540px;top:720px;width:520px;height:520px"><div id="logoDisc2" style="position:absolute;inset:0;border-radius:50%;background:#070707;box-shadow:0 0 0 10px #fbfbf7,18px 20px 0 10px rgba(0,0,0,.6)"></div></div>
      <div class="c x" id="tag" style="left:540px;top:1170px;font-size:80px;text-align:center">YOUR PROGRESS,<br><span class="lime">MADE TO SHARE.</span></div>
      <div class="c sticker lime" id="cta" style="left:540px;top:1410px;font-size:40px;transform:rotate(-2deg)">Start yours. Free on the App Store</div>
    </section>
  </div>
  <canvas id="fxCanvas" width="1080" height="1920"></canvas>
  <div id="flash"></div>
  <div id="grain"></div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script src="../../lib/kit.js"></script>
<script src="composition.js"></script>
</body>
</html>
